<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PW Player</title>
    <link rel="icon" href="https://i.ibb.co/svXfcmJr" type="image/x-icon">

    <!-- 🛡️ PROXY INTERCEPTOR: Rewrites only the direct media/segment fetches -->
    <script>
    (function() {
        const PROXY = 'https://proxy.studyparcham.in/';
        const CF = /cloudfront\.net/i;
        const PR = /proxy\.studyparcham\.in/i;
        const AS = /asmultiverse\.site/i;

        function rewrite(url) {
            if (typeof url !== 'string') return url;
            if (!CF.test(url) && !AS.test(url)) return url;
            if (PR.test(url)) return url;
            // For asmultiverse URLs, pass through unchanged
            if (AS.test(url)) return url;
            // For CloudFront URLs, route through proxy
            return PROXY + url.replace(/^https?:\/\//, '');
        }

        const origFetch = window.fetch;
        window.fetch = function(input, init) {
            if (typeof input === 'string') input = rewrite(input);
            else if (input && input.url) {
                const newUrl = rewrite(input.url);
                if (newUrl !== input.url) {
                    try { input = new Request(newUrl, input); } catch (e) {}
                }
            }
            return origFetch.call(window, input, init);
        };

        const OrigXHR = window.XMLHttpRequest;
        window.XMLHttpRequest = function() {
            const xhr = new OrigXHR();
            const origOpen = xhr.open;
            xhr.open = function(method, url, ...rest) {
                return origOpen.call(xhr, method, rewrite(url), ...rest);
            };
            return xhr;
        };

        function patchSrc(proto, prop) {
            const desc = Object.getOwnPropertyDescriptor(proto, prop);
            if (!desc || !desc.set) return;
            Object.defineProperty(proto, prop, {
                set(v) { return desc.set.call(this, rewrite(v)); },
                get: desc.get,
                configurable: true
            });
        }
        try { patchSrc(HTMLMediaElement.prototype, 'src'); } catch (e) {}
        try { patchSrc(HTMLSourceElement.prototype, 'src'); } catch (e) {}
    })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.min.js"></script>

    <style>
        :root { --pw-purple: #5a67d8; --pw-bg: #000000; --text-primary: #ffffff; --text-secondary: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;}
        body, html { margin: 0; padding: 0; background-color: var(--pw-bg); position: fixed; top: 0; bottom: 0; left: 0; right: 0; overflow: hidden; color: var(--text-primary); width: 100%; height: 100%;}
        .video-wrapper { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;}
        video { width: 100%; height: 100%; object-fit: contain; outline: none; }
        .loader-overlay { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        .spinner-ring { width: 50px; height: 50px; border: 4px solid rgba(90, 103, 216, 0.2); border-radius: 50%; border-top-color: var(--pw-purple); animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { color: var(--text-secondary); font-weight: 600; font-size: 1.05rem; text-align: center; padding: 0 20px;}
        .error-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 20, 20, 0.85); border: 1px solid #ef4444; padding: 25px; border-radius: 16px; text-align: center; color: #ef4444; font-weight: 700; z-index: 40; display: none; }
        .controls-overlay { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; background: rgba(0,0,0,0.3); opacity: 1; transition: opacity 0.4s; }
        .controls-overlay.hidden { opacity: 0; pointer-events: none; }
        .top-bar { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%); }
        .top-left { display: flex; align-items: center; gap: 20px; width: 85%;}
        .back-btn { font-size: 1.5rem; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        .video-title { font-weight: 700; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        .center-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .play-pause-center { font-size: 4.5rem; text-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; z-index: 15; opacity: 0.95;}
        .bottom-gradient { padding: 60px 20px 20px 20px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%); display: flex; flex-direction: column; width: 100%; position: absolute; bottom: 0; z-index: 12;}
        .time-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px; font-weight: 700; font-size: 0.9rem; }
        .time-left { display: flex; align-items: center; gap: 12px;}
        .speed-badge { background: var(--pw-purple); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }
        .progress-wrapper { position: relative; width: 100%; height: 20px; display: flex; align-items: center; cursor: pointer; margin-bottom: 15px; }
        .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.25); position: relative; border-radius: 2px; }
        .progress-fill { height: 100%; background: var(--pw-purple); width: 0%; border-radius: 2px;}
        .progress-thumb { position: absolute; right: -7px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; background: #fff; border-radius: 50%; opacity: 0; }
        .progress-wrapper:hover .progress-thumb { opacity: 1; }
        .progress-wrapper:hover .progress-track { height: 6px; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 24px; }
        .action-icon { font-size: 1.45rem; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
        .skip-btn { position: relative; }
        .skip-text { position: absolute; font-size: 0.55rem; font-weight: 800; top: 50%; left: 50%; transform: translate(-50%, -45%); text-shadow: none;}
        .settings-float { position: absolute; bottom: 85px; right: 20px; background: rgba(24, 24, 27, 0.95); border-radius: 12px; min-width: 240px; display: none; flex-direction: column; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .settings-float.active { display: flex; }
        .float-item { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; font-weight: 600; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .float-item:hover { background: rgba(255,255,255,0.08); }
        .float-val { color: var(--text-secondary); font-size: 0.85rem; display: flex; align-items: center;}
        .settings-menu-panel { display: none; flex-direction: column; max-height: 280px; overflow-y: auto;}
        .settings-menu-panel.active { display: flex; }
    </style>
</head>
<body>
    <div class="video-wrapper" id="video-wrapper">
        <video id="video" playsinline></video>
        <div class="error-box" id="error-box">
            <i class="fas fa-video-slash" style="font-size: 2.5rem; margin-bottom:15px;"></i><br>
            <span id="error-text">Stream Offline</span>
        </div>
        <div class="loader-overlay" id="loader">
            <div class="spinner-ring"></div>
            <div class="status-text" id="status-text">Loading lecture...</div>
        </div>
        <div class="controls-overlay" id="controls">
            <div class="top-bar">
                <div class="top-left">
                    <i class="fas fa-arrow-left back-btn" id="btn-back"></i>
                    <div class="video-title" id="video-title">Pw Player</div>
                </div>
            </div>
            <div class="center-area" id="center-click-area">
                <div class="play-pause-center" id="center-play-btn"><i class="fas fa-play" style="margin-left:8px;"></i></div>
            </div>
            <div class="bottom-gradient">
                <div class="time-row">
                    <div class="time-left">
                        <span id="current-time">00:00</span>
                        <div class="speed-badge" id="btn-menu-speed-badge"><span id="speed-val-display">1x</span></div>
                    </div>
                    <div class="time-right"><span id="duration-time">00:00</span></div>
                </div>
                <div class="progress-wrapper" id="progress-wrapper">
                    <div class="progress-track" id="progress-track">
                        <div class="progress-fill" id="progress-fill"><div class="progress-thumb"></div></div>
                    </div>
                </div>
                <div class="controls-row">
                    <div class="controls-left">
                        <div class="action-icon" id="play-btn"><i class="fas fa-play"></i></div>
                        <div class="action-icon skip-btn" id="btn-skip-back"><i class="fas fa-undo-alt"></i><span class="skip-text">10</span></div>
                        <div class="action-icon skip-btn" id="btn-skip-fwd"><i class="fas fa-redo-alt"></i><span class="skip-text">10</span></div>
                        <div class="action-icon" id="btn-mute"><i class="fas fa-volume-up" id="vol-icon"></i></div>
                    </div>
                    <div class="controls-right">
                        <div class="action-icon" id="btn-settings"><i class="fas fa-cog"></i></div>
                        <div class="action-icon" id="fullscreen-btn"><i class="fas fa-expand"></i></div>
                    </div>
                </div>
            </div>
            <div class="settings-float" id="settings-float">
                <div class="settings-menu-panel active" id="menu-main">
                    <div class="float-item" onclick="window.__openSubMenu('menu-speed')">
                        <span>Playback Speed</span>
                        <span class="float-val"><span id="speed-val-menu">Normal</span> <i class="fas fa-chevron-right ms-2 mt-1"></i></span>
                    </div>
                    <div class="float-item" onclick="window.__openSubMenu('menu-quality')">
                        <span>Video Quality</span>
                        <span class="float-val"><span id="quality-val-display">Auto</span> <i class="fas fa-chevron-right ms-2 mt-1"></i></span>
                    </div>
                </div>
                <div class="settings-menu-panel" id="menu-speed"></div>
                <div class="settings-menu-panel" id="menu-quality"></div>
            </div>
        </div>
    </div>

    <script>
    (function(){
        "use strict";
        const q = new URLSearchParams(location.search);
        const video = document.getElementById('video');
        const el = id => document.getElementById(id);
        let shakaPlayer = null;
        let qualityTracks = [];

        // ---- Helpers ----
        function time(s){
            if(!Number.isFinite(s) || s < 0) return '00:00';
            s = Math.floor(s);
            return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
        }

        // ---- Extract URL from schedule API (metadata only) ----
        async function resolveVideoUrl(){
            // 1. Direct URL from query string (highest priority)
            const directUrl = [q.get('vUrl'), q.get('url')].find(u => u && u !== 'undefined' && u !== 'null') || '';
            if (directUrl) return directUrl;

            // 2. Fetch schedule metadata ONLY, extract the video URL from it
            const batchId = q.get('batchId') || '';
            const subjectId = q.get('subjectId') || '';
            const childId = [q.get('schId'), q.get('lectureId'), q.get('videoId')].find(id => id && id !== 'undefined' && id !== 'null') || '';
            const topicId = q.get('topicId') || '';

            if (!childId) throw new Error('No lecture ID provided.');

            el('status-text').textContent = 'Fetching lecture info...';
            
            // Use pw.studyparcham.in ONLY for metadata lookup (Schedule API)
            const schedRes = await fetch(
                `https://pw.studyparcham.in/api/Schedule?BatchId=${batchId}&SubjectId=${subjectId}&ContentId=${childId}`
            );
            if (!schedRes.ok) throw new Error('Schedule API returned HTTP ' + schedRes.status);
            const schedData = await schedRes.json();
            
            if (!schedData?.success) throw new Error('Schedule not found.');
            
            const videoDetails = schedData.data?.videoDetails;
            const videoId = videoDetails?._id || videoDetails?.id || childId;

            // The schedule response itself should contain a direct video URL
            // (this is the "url" field or "streamUrl" field)
            if (schedData.data?.url) {
                return schedData.data.url;
            }
            if (schedData.data?.streamUrl) {
                return schedData.data.streamUrl;
            }

            // 3. If Schedule doesn't have the URL, get it from a dedicated endpoint
            //    (this still uses pw.studyparcham.in for metadata, but the
            //     returned URL will point to the direct proxy domain)
            el('status-text').textContent = 'Fetching stream URL...';
            
            const urlRes = await fetch(
                `https://pw.studyparcham.in/api/get-video-url?batchId=${batchId}&subjectId=${subjectId}&childId=${childId}&videoId=${videoId}&containerNum=1&topicId=${topicId}`
            );
            if (!urlRes.ok) throw new Error('Stream URL endpoint returned HTTP ' + urlRes.status);
            const urlData = await urlRes.json();
            
            if (!urlData.success) throw new Error(urlData.message || 'Could not get stream URL.');

            let streamUrl = urlData.data?.streamUrl || urlData.data?.url;
            if (!streamUrl) throw new Error('No stream URL in response.');

            // Strip any legacy proxy prefix (so it goes direct to the underlying host)
            const proxyPrefixes = [
                '/proxy.studypanda.study/', '/pw.studypanda.study/', '/physicswalla.studypanda.live/',
                '/proxy.studybeepro.site/', '/pw.studybeepro.site/', '/physicswallah.studybeepro.site/',
                '/proxy.studybeepro.in/', '/pw.studybeepro.in/', '/physicswallah.studybeepro.in/',
                '/pwakki.akkistudyx.in/', '/pw.akkistudyx.in/', '/akkistudyx.in/',
                '/pw.pwakki.in/', '/pwakki.in/'
            ];
            for (const prefix of proxyPrefixes) {
                if (streamUrl.includes(prefix)) {
                    streamUrl = streamUrl.replace(prefix, '/');
                }
            }

            // If the URL starts with "/", it's relative to pw.studyparcham.in
            // — but we don't want to serve video through pw.studyparcham.in.
            // The interceptor at the top of this file will rewrite any cloudfront
            // segment requests to go through proxy.studyparcham.in directly.
            if (streamUrl.startsWith('/')) {
                // Extract the underlying CloudFront URL
                // /cdn/d1d34.../master.mpd -> https://d1d34.../master.mpd
                const cfMatch = streamUrl.match(/^\/(?:cdn\/)?([a-z0-9]+\.cloudfront\.net\/.+)$/i);
                if (cfMatch) {
                    streamUrl = 'https://' + cfMatch[1];
                } else {
                    // Fallback: still route via pw.studyparcham.in for the manifest,
                    // but segments will be rewritten by the interceptor.
                    streamUrl = 'https://pw.studyparcham.in' + streamUrl;
                }
            }

            // Append signed URL query if present
            if (urlData.data.signedUrl) {
                streamUrl += (streamUrl.includes('?') ? '&' : '?') 
                           + urlData.data.signedUrl.replace(/^\?/, '');
            }

            return streamUrl;
        }

        // ---- Load Video ----
        async function load(){
            el('loader').style.display = 'flex';
            el('error-box').style.display = 'none';
            el('status-text').textContent = 'Loading lecture...';

            try {
                const mediaUrl = await resolveVideoUrl();

                if (window.shaka && shaka.Player.isBrowserSupported()) {
                    shakaPlayer = new shaka.Player();
                    await shakaPlayer.attach(video);

                    // Let Shaka send credentials cross-origin to the proxy
                    const net = shakaPlayer.getNetworkingEngine();
                    if (net) {
                        net.registerRequestFilter((type, request) => {
                            request.allowCrossSiteCredentials = request.uris.some(u =>
                                /cloudfront\.net|proxy\.studyparcham\.in|asmultiverse\.site/i.test(u)
                            );
                        });
                    }

                    shakaPlayer.addEventListener('error', (e) => {
                        console.error('Shaka error', e.detail);
                        el('error-box').style.display = 'block';
                        el('error-text').textContent = 'Playback failed (code ' + (e.detail?.code || '?') + ')';
                    });

                    await shakaPlayer.load(mediaUrl);
                    qualityTracks = shakaPlayer.getVariantTracks().filter(t => t.height);
                } else {
                    video.src = mediaUrl;
                }

                el('loader').style.display = 'none';
                video.play().catch(() => {});
                buildQualityMenu();
            } catch (e) {
                console.error(e);
                el('loader').style.display = 'none';
                el('error-box').style.display = 'block';
                el('error-text').textContent = e.message || 'Failed to load lecture';
            }
        }

        // ---- UI Wiring ----
        function updatePlayBtn(){
            const paused = video.paused;
            el('play-btn').innerHTML = '<i class="fas fa-' + (paused ? 'play' : 'pause') + '"></i>';
            el('center-play-btn').innerHTML = '<i class="fas fa-' + (paused ? 'play' : 'pause') + '"' + (paused ? ' style="margin-left:8px;"' : '') + '></i>';
        }
        function togglePlay(){
            if (video.paused) video.play(); else video.pause();
            updatePlayBtn();
        }

        video.addEventListener('play', updatePlayBtn);
        video.addEventListener('pause', updatePlayBtn);
        video.addEventListener('timeupdate', () => {
            el('current-time').textContent = time(video.currentTime);
            if (Number.isFinite(video.duration)) {
                el('duration-time').textContent = time(video.duration);
                el('progress-fill').style.width = (video.currentTime / video.duration * 100) + '%';
            }
        });
        video.addEventListener('loadedmetadata', () => {
            el('duration-time').textContent = time(video.duration);
        });

        el('play-btn').onclick = togglePlay;
        el('center-play-btn').onclick = togglePlay;
        el('btn-skip-back').onclick = () => video.currentTime = Math.max(0, video.currentTime - 10);
        el('btn-skip-fwd').onclick = () => {
            if (Number.isFinite(video.duration)) video.currentTime = Math.min(video.duration, video.currentTime + 10);
        };
        el('btn-mute').onclick = () => {
            video.muted = !video.muted;
            el('vol-icon').className = 'fas fa-volume-' + (video.muted ? 'xmark' : 'up');
        };

        const progressWrapper = el('progress-wrapper');
        let isScrubbing = false;
        progressWrapper.addEventListener('pointerdown', e => {
            isScrubbing = true;
            progressWrapper.setPointerCapture(e.pointerId);
            scrub(e);
        });
        progressWrapper.addEventListener('pointermove', e => { if (isScrubbing) scrub(e); });
        progressWrapper.addEventListener('pointerup', () => { isScrubbing = false; });
        function scrub(e){
            if (!Number.isFinite(video.duration)) return;
            const rect = el('progress-track').getBoundingClientRect();
            video.currentTime = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * video.duration;
        }

        const speeds = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
        function applySpeed(s){
            video.playbackRate = s;
            el('speed-val-display').textContent = s + 'x';
            el('speed-val-menu').textContent = s === 1 ? 'Normal' : s + 'x';
        }
        el('btn-menu-speed-badge').onclick = () => {
            const current = video.playbackRate;
            const idx = speeds.indexOf(current);
            const next = speeds[(idx + 1) % speeds.length];
            applySpeed(next);
        };

        function buildQualityMenu(){
            const menu = el('menu-quality');
            menu.innerHTML = '';
            const auto = document.createElement('div');
            auto.className = 'float-item';
            auto.innerHTML = '<span>Auto</span><i class="fas fa-check" style="color: var(--pw-purple);"></i>';
            auto.onclick = () => {
                shakaPlayer.configure({ abr: { enabled: true } });
                el('quality-val-display').textContent = 'Auto';
                el('settings-float').classList.remove('active');
            };
            menu.appendChild(auto);

            const seen = new Set();
            qualityTracks.forEach(t => {
                if (seen.has(t.height)) return;
                seen.add(t.height);
                const item = document.createElement('div');
                item.className = 'float-item';
                item.innerHTML = '<span>' + t.height + 'p</span>';
                item.onclick = () => {
                    shakaPlayer.configure({ abr: { enabled: false } });
                    shakaPlayer.selectVariantTrack(t, true);
                    el('quality-val-display').textContent = t.height + 'p';
                    el('settings-float').classList.remove('active');
                };
                menu.appendChild(item);
            });
        }

        el('btn-settings').onclick = () => {
            el('settings-float').classList.toggle('active');
            el('menu-main').classList.add('active');
            el('menu-speed').classList.remove('active');
            el('menu-quality').classList.remove('active');
        };
        window.__openSubMenu = (id) => {
            el('menu-main').classList.remove('active');
            el('menu-speed').classList.remove('active');
            el('menu-quality').classList.remove('active');
            el(id).classList.add('active');
            if (id === 'menu-speed') {
                const menu = el('menu-speed');
                menu.innerHTML = '';
                speeds.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'float-item';
                    item.innerHTML = '<span>' + (s === 1 ? 'Normal' : s + 'x') + '</span>';
                    item.onclick = () => { applySpeed(s); el('settings-float').classList.remove('active'); };
                    menu.appendChild(item);
                });
            }
        };

        el('fullscreen-btn').onclick = () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else el('video-wrapper').requestFullscreen().catch(() => {});
        };

        let lastActivity = Date.now();
        function showControls(){
            el('controls').classList.remove('hidden');
            lastActivity = Date.now();
        }
        el('center-click-area').addEventListener('click', (e) => {
            if (e.target.closest('.play-pause-center')) return;
            togglePlay();
            showControls();
        });
        setInterval(() => {
            if (!video.paused && Date.now() - lastActivity > 3000) {
                el('controls').classList.add('hidden');
            }
        }, 500);
        document.addEventListener('pointerdown', showControls);

        el('btn-back').onclick = () => {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'close-pw-player' }, '*');
            } else {
                history.back();
            }
        };

        if (window.shaka) shaka.polyfill.installAll();
        load();
    })();
    </script>
</body>
</html>
